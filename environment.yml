# Sets all the libraries and dependencies needed to run the program
name: bioinfo
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10
  - biopython
  - clustalo
  - blast
  - pandas
  - matplotlib
  - pytest
  - pytest-html
  - plotly
  - pre-commit
  - pip
  - pip:
    - nicegui
    - openpyxl